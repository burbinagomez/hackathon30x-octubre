# Stack local completo: Postgres + migraciones + api + web. Solo para validar en una máquina; prod sigue en
# Railway/Vercel/Supabase. Uso (desde la raíz del repo):
#   cp local/.env.example local/.env   # y completar
#   docker compose -f local/docker-compose.yml --env-file local/.env up --build
# web: http://localhost:8080 · api: http://localhost:8000/docs · postgres: localhost:5433
name: profitdata-local

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-local}
    ports: ["5433:5432"]
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

  # Lo mismo que hace CI: roles + simulación del schema de Supabase + migraciones en orden + tenant y usuario.
  preparar-db:
    image: postgres:16
    depends_on:
      db: {condition: service_healthy}
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres-local}
      APP_RT_PASSWORD: ${APP_RT_PASSWORD:-app-rt-local}
      LOCAL_AUTH_USER_ID: ${LOCAL_AUTH_USER_ID:-}
      LOCAL_TENANT_ID: ${LOCAL_TENANT_ID:-00000000-0000-4000-8000-000000000001}
    volumes:
      - ../backend/scripts:/scripts:ro
      - ../supabase/migrations:/migrations:ro
      - ./preparar_db.sh:/preparar_db.sh:ro
    entrypoint: ["bash", "/preparar_db.sh"]

  api:
    build: ../backend
    depends_on:
      preparar-db: {condition: service_completed_successfully}
    # Lista explícita, sin env_file: la api corta el arranque si ve una key de front (sb_publishable_) o del CLI.
    environment:
      PORT: "8000"
      DATABASE_URL: postgresql+psycopg://app_rt:${APP_RT_PASSWORD:-app-rt-local}@db:5432/postgres
      CIFRADO_KEY: ${CIFRADO_KEY:?falta CIFRADO_KEY en local/.env}
      AUTH_JWKS_URL: ${SUPABASE_URL:?falta SUPABASE_URL en local/.env}/auth/v1/.well-known/jwks.json
      AUTH_ISSUER: ${SUPABASE_URL}/auth/v1
      CORS_ORIGINS: http://localhost:8080
      DOCS_HABILITADAS: "true"
      IA_API_KEY: ${IA_API_KEY:-}
      IA_MODELO: ${IA_MODELO:-}
      CROMA_API_KEY: ${CROMA_API_KEY:-}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      TYPESAFE_URL: ${TYPESAFE_URL:-}
    ports: ["8000:8000"]

  web:
    build:
      context: ../frontend
      args:
        VITE_API_URL: http://localhost:8000
        VITE_SUPABASE_URL: ${SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?falta SUPABASE_PUBLISHABLE_KEY en local/.env}
    depends_on: [api]
    environment:
      PORT: "8080"
    ports: ["8080:8080"]

volumes:
  db:
