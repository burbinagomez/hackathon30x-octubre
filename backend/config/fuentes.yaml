# Registro de adaptadores — se conectan y desconectan aquí, no en el código.
# Cada adaptador implementa un puerto del dominio y pasa la misma suite de contrato.
# El orquestador solo carga los que tienen habilitado: true y cuyos `paises` y
# `filtros` cubren el ICP. Si ningún adaptador cubre un país/criterio, se reporta,
# no se inventa.

fuentes_descubrimiento:                 # puerto: FuenteDescubrimiento · orden = prioridad: gratuitas primero, Croma tercera (PRD §2)
  osm_overpass:
    habilitado: true
    proveedor: osm
    tipo: live
    paises: [CO, MX, PE, BR, "*"]
    filtros: [ciudad, tipo_negocio]
    trae: [nombre, telefono, web, email, direccion, geo]
    licencia: ODbL
  datos_gov_co_rues:
    habilitado: true                     # un flag la desconecta: false y la fuente no existe
    proveedor: datos.gov.co
    dataset: c82u-588k
    tipo: dataset
    paises: [CO]
    filtros: [ciiu, departamento]
    trae: [nit, nombre, ciiu, ciudad_camara]
    licencia: CC-BY-SA-4.0
  croma_supersociedades_co:
    habilitado: true
    proveedor: croma
    endpoint: /co/supersociedades/companies-search/v1
    tipo: dataset                        # 1 crédito
    paises: [CO]
    filtros: [ciiu, macrosector, departamento, region, ingresos_min]
    trae: [nit, nombre, ciudad, direccion, geo, ciiu, ingresos, empleados]
    tipo_titular_implicito: juridica     # todo lo supervisado es sociedad
    sesgo: "solo empresas que reportan estados financieros (medianas/grandes)"
    licencia: "datos públicos vía Croma; no redistribuir"
  croma_dian_trade_co:
    habilitado: false                    # sin adaptador todavía (no está en adaptadores/__init__.py)
    proveedor: croma
    endpoint: /co/dian-trade/directory-search/v1
    tipo: dataset
    paises: [CO]
    filtros: [partida_arancelaria, flujo, anio]
    trae: [nit, nombre, valor_usd, natural_person]
    licencia: "datos públicos vía Croma; no redistribuir"
  croma_siem_mx:
    habilitado: false                    # activar solo si el ICP incluye MX
    proveedor: croma
    endpoint: /mx/siem/establishments/v1
    tipo: live                           # 10 créditos, async
    paises: [MX]
    filtros: [estado, actividad_scian, nombre_obligatorio]
    trae: [nombre_comercial, estado, camara]   # detalle: tel, email, web, dirección
    nota: "requiere nombre (substring); descubrimiento parcial"

# OJO: de esta sección solo se leen `rues_datos_gov_co.habilitado` (composicion.verificador_titular) y
# `dominio_por_razon_social.habilitado` (composicion.buscador_sitio_web). El resto es documental:
# composicion.py arma los demás enriquecedores en código y cambiar su `habilitado` NO conecta ni desconecta nada.
enriquecedores:                          # puerto: Enriquecedor
  rues_datos_gov_co:                     # puerto: VerificadorTitular (006, enmienda 2026-10-18)
    habilitado: true                     # un flag la desconecta: false y vuelve el stub que siempre dice desconocido
    puerto: VerificadorTitular
    adaptador: app.modulos.enriquecimiento.infraestructura.adaptadores.rues_datos_gov.RuesDatosGov
    proveedor: datos.gov.co
    dataset: c82u-588k
    tipo: dataset
    paises: [CO]
    regla: "nombre normalizado exacto + misma ciudad + un solo NIT; cualquier otra cosa es desconocido"
    trae: [tipo_titular]
    licencia: CC-BY-SA-4.0
  croma_rues_co:
    habilitado: false                    # reemplazado por rues_datos_gov_co: el endpoint busca por NIT, no por nombre
    puerto: VerificadorTitular
    adaptador: app.modulos.enriquecimiento.infraestructura.adaptadores.croma_rues.CromaRues
    endpoint: /co/rues/entity-by-nit/v1
    tipo: live
    paises: [CO]
    trae: [estado_matricula, ciiu, representantes, financieros, renovaciones, tipo_titular]
  croma_supersociedades_detalle_co:
    habilitado: false                    # P4: sin implementación en la 006
    paises: [CO]
    trae: [accionistas, representante_legal, email_notificacion]
  croma_sunat_pe:
    habilitado: false
    paises: [PE]
  croma_siem_detalle_mx:
    habilitado: false
    paises: [MX]
    trae: [telefono, email, web, direccion, empleados]
  dominio_por_razon_social:              # puerto: BuscadorSitioWeb (006, enmienda 2026-10-18 "buscador de sitio web")
    habilitado: true                     # un flag lo apaga: false y un lead sin web se queda sin web (composicion.buscador_sitio_web)
    puerto: BuscadorSitioWeb
    adaptador: app.modulos.enriquecimiento.infraestructura.adaptadores.dominio_por_razon_social.DominioPorRazonSocial
    paises: [CO]
    solo_juridicas: true
    regla: "candidatos desde la razon social (max 6); DNS primero; se acepta solo si la pagina trae el NIT o la razon social completa"
    trae: [sitio_web]                    # el contacto lo saca despues sitio_web
    reglas: [dns_primero, sin_ips_privadas, timeout_4s, verificacion_obligatoria, evidencia_en_cumplimiento]
  sitio_web:
    habilitado: true
    adaptador: app.modulos.enriquecimiento.infraestructura.adaptadores.sitio_web.SitioWeb
    paises: ["*"]
    trae: [email_publicado, whatsapp_publicado, telefono_publicado]
    reglas: [robots_txt, sin_ips_privadas, max_2mb, 3_redirecciones]

canales_contacto:                        # puerto: CanalContacto
  smtp_email:
    # No hay adaptador SMTP: no se envía ningún email. Este flag solo hace que "email" sea un
    # canal_preferido válido (api/canales.py) y la pantalla Nueva búsqueda lo usa; en false, la
    # demo recibiría 422 canal_no_habilitado. El contacto real lo hace la llamada de Dapta.
    habilitado: true
    canal: email                         # lo que el usuario elige como canal_preferido
    proveedor: "SMTP nuevo para el evento"
    primer_toque: true
  whatsapp_meta:
    canal: whatsapp
    habilitado: false                    # [VALIDAR] por el dueño; mientras tanto no existe
    solo_numeros_comerciales_publicados: true
    tasa_bloqueo_max: 0.01

calificadores:                           # puerto: Calificador
  dapta_api:
    habilitado: false                    # [MENTORES] hasta tener la doc
  dapta_csv:
    habilitado: true                     # respaldo: exportar/importar

# OJO: sección documental, nadie la lee; composicion.py arma el clasificador en código.
# Honesto: TypeSafe entregó solo la API key, no la URL; sin las dos, jev no se arma. Entonces clasifica openrouter
# (misma IA de la Puerta B: IA_API_KEY + IA_MODELO). Con TYPESAFE_API_KEY y TYPESAFE_URL gana jev; sin ninguno, no hay.
clasificadores:                          # puerto: Clasificador
  jev:
    habilitado: true                     # solo si hay TYPESAFE_API_KEY y TYPESAFE_URL (hoy falta la URL)
    version: jev-1.13.0
  openrouter:
    habilitado: true                     # si jev no está y la IA está configurada; falla = encaje 'ninguna'

limites:
  croma_requests_por_24h: 100            # según catálogo; planificar consultas
  croma_creditos_gratis_mes: 1500
  overpass_req_por_seg: 1
