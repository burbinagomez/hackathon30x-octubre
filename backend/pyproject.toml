[project]
name = "dapta-leads-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.143.3",
    # Runtime: lo usa el adaptador Croma en producción.
    "httpx>=0.28.1",
    "psycopg[binary]>=3",
    "pydantic-settings>=2.16.0",
    "pyjwt[crypto]>=2.15.1",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "alembic>=1.20.0",
    "anthropic>=1.15.0",
    "import-linter>=2.15",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
]

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Fuentes prohibidas"
type = "forbidden"
source_modules = ["app"]
# import-linter 2.15 no acepta "linkedin*" (el wildcard reemplaza un módulo entero): nombres explícitos (R4).
forbidden_modules = [
    "googlemaps",
    "linkedin", "linkedin_api", "linkedin_v2",
    "instaloader",
    "facebook", "facebook_business", "facebook_scraper",
]

[[tool.importlinter.contracts]]
name = "Capas de los modulos"
type = "layers"
# "(aplicacion)": capa opcional; costos todavía no la tiene.
layers = ["infraestructura", "(aplicacion)", "dominio"]
containers = ["app.modulos.descubrimiento", "app.modulos.costos", "app.modulos.acceso"]

[[tool.importlinter.contracts]]
name = "Descubrimiento no usa la infraestructura de costos"
type = "forbidden"
# Solo app.cli une los dos módulos: descubrimiento conoce el puerto, nunca el adaptador.
source_modules = ["app.modulos.descubrimiento"]
forbidden_modules = ["app.modulos.costos.infraestructura"]

[[tool.importlinter.contracts]]
name = "Cifrado fuera del dominio"
type = "forbidden"
# El dominio maneja texto en claro; cifrar y llamar por HTTP son adaptadores (principio I).
source_modules = ["app.modulos.descubrimiento.dominio"]
forbidden_modules = ["cryptography", "httpx"]

[[tool.importlinter.contracts]]
name = "App no importa evals"
type = "forbidden"
# evals es tooling hermano de app y no entra en la imagen de api: evals -> app vale, al revés no.
source_modules = ["app"]
forbidden_modules = ["evals"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
